plugins {
    alias(libs.plugins.androidLibrary)
}

android {
    namespace = "com.openipc.xr"
    compileSdk = 34

    defaultConfig {
        minSdk = 26
    }

    buildTypes {
        release {
            ndk {
                abiFilters.add("arm64-v8a")
                abiFilters.add("armeabi-v7a")
            }
        }
        debug {
            ndk {
                abiFilters.add("arm64-v8a")
                abiFilters.add("armeabi-v7a")
            }
        }
    }

    externalNativeBuild {
        cmake {
            path("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    // The OpenXR loader is consumed as a prefab package (OpenXR::openxr_loader,
    // OpenXR::headers) out of the Khronos AAR.
    buildFeatures {
        prefab = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation(libs.annotation)

    // api, not implementation: the loader's .so and its manifest additions
    // (OpenXR broker queries/permissions) have to reach the application module.
    api(libs.openxr.loader)
}
