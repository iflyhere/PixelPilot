# Fork-only helper: build a sideloadable debug APK from any branch and publish it as a
# prerelease so it can be pulled straight onto a headset.
# Run with: gh workflow run test-apk.yml --ref master -f target_ref=<branch>
name: Test APK

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or SHA to build'
        required: true
        default: 'master'
      tag:
        description: 'Release tag to publish under'
        required: true
        default: 'xr-test'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          submodules: true
          # Without this, checkout fetches submodules with --depth=1, which cannot check out
          # a pinned commit that is no longer the tip of the submodule's default branch. It
          # then leaves devourer incomplete and CMake fails with "Cannot find source file:
          # devourer/src/HalmacCfgParam.cpp" - intermittently, depending on whether the pin
          # still happens to be reachable.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # The key comes from a repository secret, not from the cache it used to live in. A cache
      # entry expires after seven days without use, and when this one did the next run quietly
      # generated a new key. A month away was enough: every build after that was signed
      # differently from the one on the headset and could only be installed over an uninstall,
      # which wipes the app's data - offline maps, settings and the ground station key included.
      # A secret does not expire. The certificate fingerprint is printed so a mismatch can be
      # spotted from the log; that is the public half, not the key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.CI_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::CI_DEBUG_KEYSTORE_B64 is not set. Refusing to sign with a throwaway key."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > ci-debug.keystore
          keytool -list -keystore ci-debug.keystore -storepass android | grep -iE "SHA-?256"

      - name: Assemble debug
        run: |
          ./gradlew --no-daemon assembleDebug             -Pandroid.injected.signing.store.file="$PWD/ci-debug.keystore"             -Pandroid.injected.signing.store.password=android             -Pandroid.injected.signing.key.alias=pixelpilotci             -Pandroid.injected.signing.key.password=android

      - name: Name the artifact
        id: name
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "PixelPilot-${{ inputs.tag }}-${SHORT}.apk"
          echo "apk=PixelPilot-${{ inputs.tag }}-${SHORT}.apk" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Test build ${{ inputs.tag }} (${{ steps.name.outputs.short }})"
          body: |
            Debug build of `${{ inputs.target_ref }}` at `${{ steps.name.outputs.short }}`.
            Debug-signed, unminified. Sideload with:

                adb install -r ${{ steps.name.outputs.apk }}
          prerelease: true
          files: ${{ steps.name.outputs.apk }}
