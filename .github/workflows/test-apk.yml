# Fork-only helper: build a sideloadable debug APK from any branch and publish it as a
# prerelease so it can be pulled straight onto a headset.
# Run with: gh workflow run test-apk.yml --ref master -f target_ref=<branch>
name: Test APK

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or SHA to build'
        required: true
        default: 'master'
      tag:
        description: 'Release tag to publish under'
        required: true
        default: 'xr-test'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          submodules: true
          # Without this, checkout fetches submodules with --depth=1, which cannot check out
          # a pinned commit that is no longer the tip of the submodule's default branch. It
          # then leaves devourer incomplete and CMake fails with "Cannot find source file:
          # devourer/src/HalmacCfgParam.cpp" - intermittently, depending on whether the pin
          # still happens to be reachable.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # A fresh runner generates a new debug keystore every run, so every APK gets a
      # different signature and each test install needs an uninstall first - which wipes the
      # app's settings, channel included, and that looks exactly like a bug. Caching
      # ~/.android/debug.keystore did not work (the runner puts it elsewhere), so the key is
      # created explicitly in the workspace and that file is what gets cached.
      - name: Cache signing key
        uses: actions/cache@v4
        with:
          path: ci-debug.keystore
          key: android-ci-debug-keystore-v2

      - name: Ensure signing key
        run: |
          if [ ! -f ci-debug.keystore ]; then
            echo "generating a new CI signing key"
            keytool -genkeypair -v -keystore ci-debug.keystore               -storepass android -keypass android -alias pixelpilotci               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=PixelPilot Test Build, OU=CI, O=PixelPilot, C=DE"
          fi
          keytool -list -keystore ci-debug.keystore -storepass android | tail -2

      - name: Assemble debug
        run: |
          ./gradlew --no-daemon assembleDebug             -Pandroid.injected.signing.store.file="$PWD/ci-debug.keystore"             -Pandroid.injected.signing.store.password=android             -Pandroid.injected.signing.key.alias=pixelpilotci             -Pandroid.injected.signing.key.password=android

      - name: Name the artifact
        id: name
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "PixelPilot-${{ inputs.tag }}-${SHORT}.apk"
          echo "apk=PixelPilot-${{ inputs.tag }}-${SHORT}.apk" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Test build ${{ inputs.tag }} (${{ steps.name.outputs.short }})"
          body: |
            Debug build of `${{ inputs.target_ref }}` at `${{ steps.name.outputs.short }}`.
            Debug-signed, unminified. Sideload with:

                adb install -r ${{ steps.name.outputs.apk }}
          prerelease: true
          files: ${{ steps.name.outputs.apk }}
