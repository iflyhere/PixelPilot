# Fork-only helper: build a sideloadable debug APK from any branch and publish it as a
# prerelease so it can be pulled straight onto a headset.
# Run with: gh workflow run test-apk.yml --ref master -f target_ref=<branch>
name: Test APK

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or SHA to build'
        required: true
        default: 'master'
      tag:
        description: 'Release tag to publish under'
        required: true
        default: 'xr-test'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # A fresh runner generates a new debug keystore every run, which makes every APK
      # signed with a different key and forces an uninstall before each test install.
      # Caching it keeps the signature stable so `adb install -r` works.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the artifact
        id: name
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "PixelPilot-${{ inputs.tag }}-${SHORT}.apk"
          echo "apk=PixelPilot-${{ inputs.tag }}-${SHORT}.apk" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Test build ${{ inputs.tag }} (${{ steps.name.outputs.short }})"
          body: |
            Debug build of `${{ inputs.target_ref }}` at `${{ steps.name.outputs.short }}`.
            Debug-signed, unminified. Sideload with:

                adb install -r ${{ steps.name.outputs.apk }}
          prerelease: true
          files: ${{ steps.name.outputs.apk }}
