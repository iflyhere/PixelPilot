# Fork-only helper: compile a branch without needing the release keystore.
# Run with: gh workflow run verify-branch.yml --ref master -f target_ref=<branch>
name: Verify branch

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or SHA to compile'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          submodules: true
          # Without this, checkout fetches submodules with --depth=1, which cannot check out
          # a pinned commit that is no longer the tip of the submodule's default branch. It
          # then leaves devourer incomplete and CMake fails with "Cannot find source file:
          # devourer/src/HalmacCfgParam.cpp" - intermittently, depending on whether the pin
          # still happens to be reachable.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug
